:root{
  --bg:#eef2f7;
  --surface:#ffffff;
  --surface2:#f2f5f9;
  --line:#cad5e3;
  --text:#12233d;
  --muted:#5c6b7f;
  --gold:#c99a1e;
  --gold2:#fff0b8;
  --blue:#1668b5;
  --green:#178a54;
  --red:#d33a44;
  --orange:#b96a00;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.serif{
  font-family:Georgia,"Times New Roman",serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

input,select,textarea{
  background:#fff;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:10px 11px;
  width:100%;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(233,184,74,.16)
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 4px 18px rgba(18,35,61,.05)
}

.gold{
  color:var(--gold)
}

.muted{
  color:var(--muted)
}

.small{
  font-size:13px;
  line-height:1.5
}

.pill{
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  background:#f7f9fc
}

.chipbtn{
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 12px;
  background:#fff;
  color:var(--text);
  white-space:nowrap
}

.chipbtn.active{
  background:#12233d;
  color:#fff;
  border-color:#12233d;
  font-weight:800
}

.btn{
  background:#12233d;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:800
}

.btn2{
  background:#d9e9fa;
  color:#12233d;
  border:1px solid #b8d2ec;
  border-radius:10px;
  padding:10px 12px;
  font-weight:700
}

.btn3{
  background:#fff;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 11px;
  font-weight:700
}

.btn:disabled{
  opacity:.5
}

.kpi-num{
  font-size:30px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.04em
}

.thumb{
  height:120px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  background:#e8eef7;
  border:1px solid var(--line)
}

.tablewrap{
  width:100%;
  overflow-x:auto
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:760px
}

th{
  font-size:12px;
  text-align:left;
  color:var(--muted);
  padding:11px;
  border-bottom:1px solid var(--line)
}

td{
  padding:11px;
  border-bottom:1px solid #e2e8f0;
  vertical-align:middle
}

.progress{
  height:9px;
  background:#e8eef7;
  border-radius:99px;
  overflow:hidden
}

.progress>div{
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--gold))
}

.doc-sheet{
  background:#fff;
  color:#12233d;
  border:1px solid #cad5e3;
  border-radius:14px
}
